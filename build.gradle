plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'idea'
}

version = mod_version
group = mod_group_id

base { archivesName = "schematicannon-${minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}

sourceSets.main.java {
    // Legacy Registrate/datagen helpers are replaced by native Minecraft registries.
    exclude 'com/bikerboys/schematicannon/foundation/data/**'
    exclude 'com/bikerboys/schematicannon/api/registry/registrate/**'
    exclude 'com/bikerboys/schematicannon/impl/registrate/**'
    // The old baked-model swapper depends on Flywheel/Catnip; rendering is ported separately.
    exclude 'com/bikerboys/schematicannon/foundation/model/ModelSwapper.java'
    exclude 'com/bikerboys/schematicannon/foundation/block/render/CustomBlockModels.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/render/CustomItemModels.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/render/CustomRenderedItemModel.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/render/CustomRenderedItemModelRenderer.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/render/CustomRenderedItems.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/render/SimpleCustomRenderer.java'
    exclude 'com/bikerboys/schematicannon/foundation/mixin/accessor/FluidInteractionRegistryAccessor.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/ItemDescription.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/TooltipModifier.java'
    exclude 'com/bikerboys/schematicannon/foundation/networking/ISyncPersistentData.java'
    exclude 'com/bikerboys/schematicannon/foundation/utility/ServerSpeedProvider.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/CombustibleItem.java'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'fabric_loader_version', fabric_loader_version
    inputs.property 'fabric_api_version', fabric_api_version
    filesMatching('fabric.mod.json') {
        expand(
            version: project.version,
            minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version: fabric_api_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xmaxerrs', '2000', '-Xmaxwarns', '2000'])
}

tasks.register('smokeTestLitematics', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.bikerboys.schematicannon.content.schematics.LitematicImporterSmokeTest'
    def litematicDir = providers.gradleProperty('litematicDir')
    doFirst {
        if (!litematicDir.isPresent())
            throw new GradleException('Pass -PlitematicDir=/path/to/schematics')
        args litematicDir.get()
    }
}

def licenseArchiveName = base.archivesName.get()
jar {
    exclude 'com/bikerboys/schematicannon/content/schematics/LitematicImporterSmokeTest.class'
    exclude 'META-INF/mods.toml'
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'META-INF/accesstransformer.cfg'
    from('LICENSE') { rename { "${it}_${licenseArchiveName}" } }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
}

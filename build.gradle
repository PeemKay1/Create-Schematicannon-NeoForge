plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

version = mod_version
group = mod_group_id

base { archivesName = "schematicannon-${minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}

sourceSets.main.java {
    // Legacy Registrate/datagen helpers are replaced by native NeoForge registries.
    exclude 'com/bikerboys/schematicannon/foundation/data/**'
    exclude 'com/bikerboys/schematicannon/api/registry/registrate/**'
    exclude 'com/bikerboys/schematicannon/impl/registrate/**'
    // The old baked-model swapper depends on Flywheel/Catnip; rendering is ported separately.
    exclude 'com/bikerboys/schematicannon/foundation/model/ModelSwapper.java'
    exclude 'com/bikerboys/schematicannon/foundation/block/render/CustomBlockModels.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/render/CustomItemModels.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/render/CustomRenderedItemModel.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/render/CustomRenderedItemModelRenderer.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/render/CustomRenderedItems.java'
    exclude 'com/bikerboys/schematicannon/foundation/item/render/SimpleCustomRenderer.java'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

neoForge {
    enable {
        version = neo_version
        disableRecompilation = true
    }
    validateAccessTransformers = false
    runs {
        client {
            client()
        }
        server { server(); programArgument '--nogui' }
        data {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range, neo_version: neo_version, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version, mod_author: mod_author, mod_description: mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xmaxerrs', '2000', '-Xmaxwarns', '2000'])
}

tasks.register('smokeTestLitematics', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.bikerboys.schematicannon.content.schematics.LitematicImporterSmokeTest'
    def litematicDir = providers.gradleProperty('litematicDir')
    doFirst {
        if (!litematicDir.isPresent())
            throw new GradleException('Pass -PlitematicDir=/path/to/schematics')
        args litematicDir.get()
    }
}

def licenseArchiveName = base.archivesName.get()
jar {
    exclude 'com/bikerboys/schematicannon/content/schematics/LitematicImporterSmokeTest.class'
    from('LICENSE') { rename { "${it}_${licenseArchiveName}" } }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    manifest.attributes('MixinConfigs': 'schematicannon.mixins.json')
}
